<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Style Chatbot</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }

  /* Chat container */
  #chatbot-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 320px;
    font-family: Arial, sans-serif;
    border-radius: 10px;
    overflow: hidden;
    z-index: 9999;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    background-color: #f0f0f0;
    display: flex;
    flex-direction: column;
    transition: all 0.3s;
  }

  /* Header like WhatsApp */
  #chatbot-header {
    background-color: #075e54;
    color: white;
    padding: 12px;
    cursor: pointer;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #chatbot-header span {
    font-weight: normal;
    font-size: 16px;
  }

  /* Chat body */
  #chatbot-body {
    display: flex;
    flex-direction: column;
    height: 400px;
    background: #e5ddd5;
  }

  #chatbot-messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* Chat bubbles */
  #chatbot-messages .bot {
    background-color: #ffffff;
    color: #000;
    align-self: flex-start;
    padding: 8px 12px;
    border-radius: 7.5px;
    max-width: 75%;
    margin-bottom: 8px;
    position: relative;
  }

  #chatbot-messages .bot::after {
    content: "";
    position: absolute;
    top: 0;
    left: -6px;
    width: 0;
    height: 0;
    border-top: 10px solid #ffffff;
    border-right: 6px solid transparent;
  }

  #chatbot-messages .user {
    background-color: #dcf8c6;
    color: #000;
    align-self: flex-end;
    padding: 8px 12px;
    border-radius: 7.5px;
    max-width: 75%;
    margin-bottom: 8px;
    position: relative;
  }

  #chatbot-messages .user::after {
    content: "";
    position: absolute;
    top: 0;
    right: -6px;
    width: 0;
    height: 0;
    border-top: 10px solid #dcf8c6;
    border-left: 6px solid transparent;
  }

  /* Input box */
  #chatbot-input {
    border: none;
    padding: 12px;
    width: calc(100% - 24px);
    outline: none;
    border-top: 1px solid #ddd;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="chatbot-container">
  <div id="chatbot-header" onclick="toggleChat()">
    Chatbot <span id="chatbot-toggle">−</span>
  </div>
  <div id="chatbot-body">
    <div id="chatbot-messages"></div>
    <input type="text" id="chatbot-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
  </div>
</div>

<script>
let minimized = false;

function toggleChat() {
  const body = document.getElementById('chatbot-body');
  const toggle = document.getElementById('chatbot-toggle');
  minimized = !minimized;
  body.style.display = minimized ? 'none' : 'flex';
  toggle.innerText = minimized ? '+' : '−';
}

function handleKeyPress(event) {
  if (event.key === 'Enter') {
    sendMessage();
  }
}

function sendMessage() {
  const input = document.getElementById('chatbot-input');
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, 'user');
  input.value = '';

  // 👉 Send user message to your Express server (POST /chat)
  fetch('http://localhost:3000/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message })
  })
  .then(res => res.json())
  .then(data => {
    // data.id = SSE stream ID
    startSSEStream(data.id);
  })
  .catch(err => {
    console.error('Chat Error:', err);
    addMessage('Server error. Please try again.', 'bot');
  });
}

function startSSEStream(id) {
  const eventSource = new EventSource(`http://localhost:3000/events/${id}`);
  let botBuffer = '';

  eventSource.onmessage = (event) => {
    const payload = JSON.parse(event.data);

    if (payload.type === 'token') {
      botBuffer += payload.content;
      updateBotMessage(botBuffer);
    }

    if (payload.type === 'tool') {
      // Optional: Show tool messages
      // addMessage(`[tool]\n${payload.content}`, 'bot');
    }

    if (payload.type === 'done') {
      eventSource.close();
    }
  };

  eventSource.onerror = (err) => {
    console.error('SSE Error:', err);
    eventSource.close();
  };
}

// Live updating bot bubble
let liveBotMessageDiv = null;

function updateBotMessage(text) {
  const messages = document.getElementById('chatbot-messages');

  if (!liveBotMessageDiv) {
    liveBotMessageDiv = document.createElement('div');
    liveBotMessageDiv.className = 'bot';
    messages.appendChild(liveBotMessageDiv);
  }

  // Display only the actual content, not the [tool] label
  liveBotMessageDiv.innerText = text.trim();
  messages.scrollTop = messages.scrollHeight;
}

function addMessage(text, sender) {
  const messages = document.getElementById('chatbot-messages');

  const messageDiv = document.createElement('div');
  messageDiv.className = sender;
  messageDiv.innerText = text;

  messages.appendChild(messageDiv);
  messages.scrollTop = messages.scrollHeight;

  // Reset bot streaming bubble on new user message
  if (sender === 'user') {
    liveBotMessageDiv = null;
  }
}
</script>

</body>
</html>
